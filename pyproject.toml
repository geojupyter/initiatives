[project]
name = "geojupyter-initiatives"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "gh-issue-validator",
]

[dependency-groups]
dev = [
  "mypy>=1.19.1",
]


[tool.mypy]
files = [".github/issue_validator.py"]
python_version = "3.12"
strict = true


[tool.ruff.lint]
extend-select = [
  "I",  # isort
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
preview = "myst start"
render = "myst build --strict --html"

[tool.pixi.dependencies]
mystmd = ">=1.10.1,<2"
